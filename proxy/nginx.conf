# nginx.conf
# Proxy inverso del Sistema C2C (arquitectura multicapa, restricción 1.d)
# - Sirve el frontend estático
# - Reenvía /api/* al contenedor de la API (Node.js/Express)
# - Termina SSL y aplica rate limiting básico

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Zona de rate limiting: máximo 10 peticiones/seg por IP a la API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream backend_api {
        # Balanceo de carga entre instancias del backend (escalado horizontal)
        server backend:3000;
        # server backend2:3000; # instancia adicional en escenarios de alta demanda
    }

    server {
        listen 80;
        server_name c2c-marketplace.com www.c2c-marketplace.com;

        # Redirección forzada a HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name c2c-marketplace.com www.c2c-marketplace.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # --- Capa de presentación: archivos estáticos del frontend ---
        root /usr/share/nginx/html;
        index register.html;

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=3600";
        }

        # --- Reenvío a la capa de API (Node.js/Express) ---
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts para no saturar el backend
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Healthcheck del proxy
        location /health {
            access_log off;
            return 200 "ok";
        }
    }
}
