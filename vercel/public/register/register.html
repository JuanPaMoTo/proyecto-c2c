<!-- HU-01: Registro de Usuarios -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta | Nexora Marketplace</title>
  <meta name="theme-color" content="#171a21">
  <link rel="stylesheet" href="register.css" />
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <main class="contenedor">
    <form id="formRegistro" class="tarjeta" novalidate aria-label="Formulario de registro">
      <h1>Crear cuenta</h1>

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required aria-required="true" />
      <span class="error" id="errorNombre"></span>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required aria-required="true" />
      <span class="error" id="errorEmail"></span>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required aria-required="true" />
      <span class="error" id="errorPassword"></span>
      <div class="fortaleza" id="fortalezaPassword"></div>

      <label for="confirmPassword">Confirmar contraseña</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required aria-required="true" />
      <span class="error" id="errorConfirmPassword"></span>

      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" name="telefono" required aria-required="true" />
      <span class="error" id="errorTelefono"></span>

      <button type="submit" id="btnRegistrar" disabled>Registrarme</button>
      <p class="mensaje" id="mensajeServidor" role="alert"></p>
    </form>
  </main>
  <script src="register.js"></script>
</body>
</html>
