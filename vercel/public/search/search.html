<!-- HU-03: Búsqueda y Filtrado de Productos -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explorar productos \| Nexora</title>
  <link rel="stylesheet" href="search.css" />
</head>
<body>
  <header class="barra-busqueda">
    <input type="text" id="inputBusqueda" placeholder="Buscar productos..." aria-label="Buscar productos" />
    <button id="btnBuscar">Buscar</button>
  </header>

  <div class="layout">
    <aside class="filtros" aria-label="Filtros de búsqueda">
      <h2>Filtros</h2>
      <label for="categoria">Categoría</label>
      <select id="categoria">
        <option value="">Todas</option>
        <option value="electronica">Electrónica</option>
        <option value="hogar">Hogar</option>
        <option value="moda">Moda</option>
        <option value="deportes">Deportes</option>
        <option value="otros">Otros</option>
      </select>

      <label for="minPrice">Precio mínimo</label>
      <input type="number" id="minPrice" min="0" />

      <label for="maxPrice">Precio máximo</label>
      <input type="number" id="maxPrice" min="0" />

      <button id="btnAplicarFiltros">Aplicar filtros</button>
    </aside>

    <main class="resultados" id="resultados" aria-live="polite">
      <!-- Tarjetas de productos renderizadas dinámicamente -->
    </main>
  </div>

  <script src="search.js"></script>
</body>
</html>
