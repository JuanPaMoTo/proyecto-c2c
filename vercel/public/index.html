
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171a21">
  <meta name="description" content="Nexora: descubre productos, compara precios y compra en nuestro marketplace.">
  <title>Nexora Marketplace | Tienda</title>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>

  <main class="home-contenido">
    <section class="home-banner">
      <h1>Bienvenido a Nexora</h1>
      <p>
        Descubre productos, compara precios y encuentra lo que buscas
        en un marketplace creado para conectar compradores y vendedores.
      </p>

      <a
        href="/search/search.html"
        style="display:inline-block;padding:12px 18px;background:#1a9fff;color:white;border-radius:4px"
      >
        Explorar productos
      </a>
    </section>

    <section>
      <h2 class="home-seccion-titulo">Productos disponibles</h2>

      <div id="catalogo" class="home-catalogo" aria-live="polite">
        <p>Cargando productos...</p>
      </div>
    </section>
  </main>

  <script src="/shared.js"></script>

  <script>
    const catalogo = document.getElementById('catalogo');

    async function cargarProductos() {
      catalogo.replaceChildren();

      const cargando = document.createElement('p');
      cargando.textContent = 'Cargando productos...';
      catalogo.appendChild(cargando);

      try {
        const respuesta = await fetch('/api/products');

        if (!respuesta.ok) {
          throw new Error('No se pudieron consultar los productos');
        }

        const datos = await respuesta.json();
        const productos = datos.productos || [];

        catalogo.replaceChildren();

        if (productos.length === 0) {
          const mensaje = document.createElement('p');
          mensaje.textContent =
            'Todavía no hay productos disponibles.';
          catalogo.appendChild(mensaje);
          return;
        }

        productos.forEach(producto => {
          const tarjeta = document.createElement('article');
          tarjeta.className = 'home-producto';

          const imagen = document.createElement('img');
          imagen.src = producto.imagenes?.[0] ||
            'https://placehold.co/400x300/16202d/66c0f4?text=Nexora';

          imagen.alt = producto.titulo || 'Producto';
          imagen.loading = 'lazy';

          imagen.onerror = function () {
            this.onerror = null;
            this.src =
              'https://placehold.co/400x300/16202d/66c0f4?text=Sin+imagen';
          };

          const info = document.createElement('div');
          info.className = 'home-producto-info';

          const categoria = document.createElement('p');
          categoria.className = 'categoria';
          categoria.textContent = producto.categoria || 'General';

          const titulo = document.createElement('h3');
          titulo.textContent =
            producto.titulo || 'Producto sin título';

          const descripcion = document.createElement('p');
          descripcion.textContent =
            producto.descripcion || 'Sin descripción disponible.';

          const precio = document.createElement('p');
          precio.className = 'precio';
          precio.textContent = '$' +
            Number(producto.precio || 0).toLocaleString('es-CO');

          const boton = document.createElement('button');
          boton.type = 'button';
          boton.textContent = 'Ver producto';

          boton.addEventListener('click', () => {
            if (!producto._id) return;

            window.location.href =
              '/checkout/checkout.html?id=' +
              encodeURIComponent(producto._id);
          });

          info.append(
            categoria,
            titulo,
            descripcion,
            precio,
            boton
          );

          tarjeta.append(imagen, info);
          catalogo.appendChild(tarjeta);
        });

      } catch (error) {
        console.error('Error cargando productos:', error);
        catalogo.replaceChildren();

        const mensaje = document.createElement('p');
        mensaje.textContent =
          'No fue posible cargar los productos. Intenta nuevamente.';

        const reintentar = document.createElement('button');
        reintentar.textContent = 'Reintentar';
        reintentar.addEventListener('click', cargarProductos);

        catalogo.append(mensaje, reintentar);
      }
    }

    cargarProductos();
  </script>

</body>
</html>
