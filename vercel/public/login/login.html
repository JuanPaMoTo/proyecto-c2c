
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171a21">
  <title>Iniciar sesión | Nexora</title>
  <link rel="stylesheet" href="/theme.css">

  <style>
    .login-contenedor {
      max-width: 440px;
      margin: 45px auto;
      padding: 20px;
    }

    .login-contenedor .tarjeta {
      gap: 12px;
    }

    .login-logo {
      display: block;
      margin-bottom: 8px;
      color: #66c0f4;
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 2px;
    }

    .login-descripcion {
      color: #aab7c4;
      text-align: center;
    }

    .login-contenedor form button {
      width: 100%;
      margin-top: 22px;
    }

    .login-enlaces {
      text-align: center;
      color: #aab7c4;
    }
  </style>
</head>
<body>

  <main class="login-contenedor">
    <section class="tarjeta">
      <a class="login-logo" href="/">NEXORA</a>

      <h1 style="text-align:center">Iniciar sesión</h1>

      <p class="login-descripcion">
        Accede a tu cuenta para publicar productos y gestionar tus compras.
      </p>

      <form id="formLogin">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="email"
        >

        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        >

        <button id="btnLogin" type="submit">Iniciar sesión</button>

        <p id="mensaje" class="mensaje" role="alert"></p>
      </form>

      <p class="login-enlaces">
        ¿No tienes cuenta?
        <a href="/register/register.html">Regístrate aquí</a>
      </p>

      <p class="login-enlaces">
        <a href="/">Volver a Nexora</a>
      </p>
    </section>
  </main>

  <script src="/shared.js"></script>

  <script>
    const form = document.getElementById('formLogin');
    const mensaje = document.getElementById('mensaje');
    const boton = document.getElementById('btnLogin');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      mensaje.textContent = '';
      boton.disabled = true;
      boton.textContent = 'Ingresando...';

      try {
        const respuesta = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
          throw new Error(
            datos.error || 'No fue posible iniciar sesión.'
          );
        }

        if (!datos.token) {
          throw new Error(
            'El servidor no devolvió el token de autenticación.'
          );
        }

        localStorage.setItem('token', datos.token);

        const usuario = datos.user || datos.usuario;

        if (usuario) {
          localStorage.setItem('usuario', JSON.stringify(usuario));
        }

        window.location.href = '/';

      } catch (error) {
        mensaje.style.color = '#ff6b6b';
        mensaje.textContent =
          error.message || 'Error de conexión con el servidor.';
      } finally {
        boton.disabled = false;
        boton.textContent = 'Iniciar sesión';
      }
    });
  </script>

</body>
</html>
