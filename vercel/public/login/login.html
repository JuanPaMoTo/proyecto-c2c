
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | GIATE</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .tarjeta {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #191919;
      border: 1px solid #303030;
      border-radius: 18px;
    }

    .logo {
      display: block;
      margin-bottom: 25px;
      color: #20c45a;
      font-size: 27px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }

    h1 { text-align: center; }

    label {
      display: block;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      color: white;
      background: #292929;
      border: 1px solid #444;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #20bd58;
      border: 0;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    #mensaje {
      color: #ff7777;
      text-align: center;
      line-height: 1.5;
    }

    .enlace {
      margin-top: 20px;
      text-align: center;
      color: #bbb;
    }

    a { color: #20c45a; }
  </style>
</head>

<body>
  <main class="tarjeta">
    <a class="logo" href="/">▣ GIATE.</a>

    <h1>Iniciar Sesión</h1>
    <p style="text-align:center;color:#bbb">
      Ingresa a tu cuenta de GIATE Marketplace.
    </p>

    <form id="formLogin">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">Contraseña</label>
      <input id="password" type="password" required
             autocomplete="current-password">

      <button id="btnLogin" type="submit">Iniciar Sesión</button>
      <p id="mensaje" role="alert"></p>
    </form>

    <p class="enlace">
      ¿No tienes cuenta?
      <a href="/register/register.html">Regístrate aquí</a>
    </p>

    <p class="enlace"><a href="/">Volver al catálogo</a></p>
  </main>

  <script>
    const form = document.getElementById('formLogin');
    const mensaje = document.getElementById('mensaje');
    const boton = document.getElementById('btnLogin');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensaje.textContent = '';
      boton.disabled = true;
      boton.textContent = 'Ingresando...';

      try {
        const respuesta = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
          throw new Error(datos.error || 'No fue posible iniciar sesión.');
        }

        localStorage.setItem('token', datos.token);
        localStorage.setItem('usuario', JSON.stringify(datos.user));

        window.location.href = '/';
      } catch (error) {
        mensaje.textContent =
          error.message || 'Error de conexión con el servidor.';
      } finally {
        boton.disabled = false;
        boton.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
