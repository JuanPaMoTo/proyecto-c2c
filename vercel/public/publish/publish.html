<!-- HU-02: Publicación de un producto para la venta -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171a21">

  <title>Publicar producto | Nexora</title>

  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/publish/publish.css">
</head>
<body>
  <main class="contenedor-publicar">
    <section class="encabezado-publicar">
      <p class="etiqueta-nexora">NEXORA MARKETPLACE</p>
      <h1>Publica tu producto</h1>
      <p>Comparte lo que vendes y encuentra compradores en Nexora.</p>
    </section>

    <form
      id="formPublicar"
      class="tarjeta-publicar"
      aria-label="Formulario de publicación de producto"
    >
      <h2>Información del producto</h2>
      <p class="texto-ayuda">Completa los datos para publicar tu producto.</p>

      <label for="titulo">Título del producto</label>
      <input
        type="text"
        id="titulo"
        placeholder="Ej. Audífonos inalámbricos"
        maxlength="120"
        required
      >

      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        rows="4"
        placeholder="Describe el estado y las características del producto..."
        required
      ></textarea>

      <div class="fila">
        <div class="campo-fila">
          <label for="precio">Precio (USD)</label>
          <input
            type="number"
            id="precio"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          >
        </div>

        <div class="campo-fila">
          <label for="categoria">Categoría</label>
          <select id="categoria" required>
            <option value="">Selecciona...</option>
            <option value="electronica">Electrónica</option>
            <option value="hogar">Hogar</option>
            <option value="moda">Moda</option>
            <option value="deportes">Deportes</option>
            <option value="otros">Otros</option>
          </select>
        </div>
      </div>

      
      <label for="imagen">Enlace de la imagen del producto</label>
      <input
        type="url"
        id="imagen"
        name="imagen"
        placeholder="https://ejemplo.com/imagen.jpg"
        accept="image/*"
      >
      <div id="previsualizacion"></div>

      <button type="submit" id="btnPublicar" disabled>
        Publicar producto
      </button>

      <p class="mensaje" id="mensajeServidor" role="alert"></p>
    </form>
  </main>

  <script src="/shared.js"></script>
  <script src="/publish/publish.js"></script>
</body>
</html>
