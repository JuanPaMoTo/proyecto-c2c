<!-- HU-02: Publicación de un Producto para la Venta -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicar producto | Sistema C2C</title>
  <link rel="stylesheet" href="publish.css" />
</head>
<body>
  <main class="contenedor">
    <form id="formPublicar" class="tarjeta" aria-label="Formulario de publicación de producto">
      <h1>Publicar producto</h1>

      <label for="titulo">Título</label>
      <input type="text" id="titulo" required />

      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" rows="4" required></textarea>

      <div class="fila">
        <div>
          <label for="precio">Precio (USD)</label>
          <input type="number" id="precio" min="0" step="0.01" required />
        </div>
        <div>
          <label for="categoria">Categoría</label>
          <select id="categoria" required>
            <option value="">Selecciona...</option>
            <option value="electronica">Electrónica</option>
            <option value="hogar">Hogar</option>
            <option value="moda">Moda</option>
            <option value="deportes">Deportes</option>
            <option value="otros">Otros</option>
          </select>
        </div>
      </div>

      <label for="imagenes">Imágenes del producto</label>
      <input type="file" id="imagenes" accept="image/*" multiple />
      <div class="previsualizacion" id="previsualizacion"></div>

      <button type="submit" id="btnPublicar" disabled>Publicar producto</button>
      <p class="mensaje" id="mensajeServidor" role="alert"></p>
    </form>
  </main>
  <script src="publish.js"></script>
</body>
</html>
